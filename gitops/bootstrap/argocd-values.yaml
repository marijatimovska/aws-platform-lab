# Lab-sized ArgoCD: no HA, no dex/SSO, fits on small nodes.
# Access the UI with port-forward (no public exposure, no extra LB cost):
#   kubectl port-forward svc/argocd-server -n argocd 8080:443
redis-ha:
  enabled: false
controller:
  replicas: 1
server:
  replicas: 1
repoServer:
  replicas: 1
applicationSet:
  replicas: 1
dex:
  enabled: false
notifications:
  enabled: false
