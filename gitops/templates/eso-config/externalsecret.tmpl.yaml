apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webapp-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: webapp-db # the k8s Secret the webapp Deployment reads
  data:
    - secretKey: host
      remoteRef:
        key: __DB_SECRET_NAME__
        property: host
    - secretKey: dbname
      remoteRef:
        key: __DB_SECRET_NAME__
        property: dbname
    - secretKey: username
      remoteRef:
        key: __DB_SECRET_NAME__
        property: username
    - secretKey: password
      remoteRef:
        key: __DB_SECRET_NAME__
        property: password
