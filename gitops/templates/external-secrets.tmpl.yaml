# External Secrets Operator: syncs AWS Secrets Manager -> k8s Secrets.
# Its service account assumes an IRSA role (data layer) scoped to ONE secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "*"
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: __ESO_ROLE_ARN__
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
