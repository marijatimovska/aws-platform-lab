# App-of-apps: this one Application makes ArgoCD manage everything in
# gitops/clusters/__ENV__/ (including itself - the file is in that folder).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-__ENV__
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: main
    path: gitops/clusters/__ENV__
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
