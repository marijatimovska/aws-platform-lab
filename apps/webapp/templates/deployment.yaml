apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "webapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webapp.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Spread replicas across AZs so one data-center outage never takes all pods.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "webapp.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "webapp.selectorLabels" . | nindent 14 }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: STATIC_SITE_URL
              value: {{ .Values.staticSiteUrl | quote }}
            {{- if .Values.database.secretName }}
            # Non-sensitive connection details, delivered by the chain
            # Secrets Manager -> External Secrets Operator -> k8s Secret.
            # (Deliberately NOT the password - the page only displays host/dbname.)
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: host
                  optional: true # pod still starts if ESO hasn't synced yet
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: dbname
                  optional: true
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Limit envsubst to our variables so nginx runtime vars stay untouched.
            - name: NGINX_ENVSUBST_FILTER
              value: "^(ENVIRONMENT|STATIC_SITE_URL|POD_NAME|POD_IP|NODE_NAME|DB_HOST|DB_NAME)$"
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nginx-template
          configMap:
            name: webapp-nginx
